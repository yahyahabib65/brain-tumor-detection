[project]
name = "brain-tumor-detection"
version = "1.0.0"
description = "Dual-mode Brain Tumor Detection system using PyTorch (ResNet-18 CNN & Tabular MLP), EasyOCR, and Streamlit."
readme = "README.md"
authors = [
    { name = "Yahya Habib", email = "yahyahabib65@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "easyocr>=1.7.2",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "ruff>=0.17.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "ty>=0.0.91",
]

[project.scripts]
brain-tumor-detection = "brain_tumor_detection:main"

[[tool.uv.index]]
url = "https://pytorch.org/"

[tool.ty.rules]
invalid-mutable-override = "ignore"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
